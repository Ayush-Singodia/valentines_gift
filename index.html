<!-- ======================= index.html ======================= -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Valentine's Day 💖</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">

<!-- CSS File -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
<h1>Happy Valentine's Day 💕</h1>
<h2>My Love</h2>
<p>
Every heartbeat of mine whispers your name.
You are my today, my tomorrow, and my forever. 🌸
</p>
<button class="heart-btn" onclick="showLove()">Send Love 💖</button>

<!-- Add this new button below your existing Send Love button -->
<button class="love-test-btn" onclick="startLoveTest()">Let's Give a Love Test 💘</button>

<!-- Love Test container -->
<div class="love-test-container" id="loveTestContainer">
  <div class="question-box" id="questionBox">
    <h2 id="questionText"></h2>
    <div id="optionsContainer"></div>
  </div>
</div>

<!-- Final Valentine Message -->
<div class="valentine-message" id="valentineMessage">
  <h2>You are already my Valentine, My Love 💖</h2>
</div>


</div>

<div class="floating-hearts" id="hearts"></div>

<!-- JS File -->
<script src="script.js"></script>
</body>
</html>
